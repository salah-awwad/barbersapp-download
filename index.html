<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download App</title>
</head>

<body>
<script>
  const androidUrl =
    "https://play.google.com/store/apps/details?id=com.spinel.barbersapp";

  const iosUrl =
    "https://apps.apple.com/il/app/jys-app/id6809929352";

  const userAgent =
    navigator.userAgent ||
    navigator.vendor ||
    window.opera;

  if (/android/i.test(userAgent)) {
    window.location.replace(androidUrl);
  } else if (/iPad|iPhone|iPod/.test(userAgent)) {
    window.location.replace(iosUrl);
  } else {
    window.location.replace(androidUrl);
  }
</script>
</body>
</html>
